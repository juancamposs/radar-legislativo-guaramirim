name: Atualização diária do Radar

on:
  schedule:
    - cron: "0 7 * * *" # 04:00 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/atualizar.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  coletar:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.atualiza.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Coletar, processar e validar
        id: atualiza
        env:
          CAMARA_TOKEN: ${{ secrets.CAMARA_TOKEN }}
        run: |
          set +e
          python scripts/atualizar.py
          cod=$?
          if [ $cod -eq 0 ]; then echo "status=ok" >> "$GITHUB_OUTPUT"; else echo "status=reprovado" >> "$GITHUB_OUTPUT"; fi
          tail -n 1 dados/historico-coleta.jsonl || true
      - name: Salvar dados (ou só o registro do erro)
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add dados/historico-coleta.jsonl dados/relatorio-coleta.json dados/brutos/presencas-pdf.json site/dados/radar.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "dados: coleta diária ($(date -u +%F)) — ${{ steps.atualiza.outputs.status }}"
          git push
      - name: Avisar falha
        if: steps.atualiza.outputs.status != 'ok'
        run: |
          echo "::warning::Coleta reprovada ou incompleta. O site continua com a última versão validada. Veja dados/historico-coleta.jsonl."

  publicar:
    needs: [coletar]
    if: always() && (needs.coletar.result == 'success' || needs.coletar.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
